spring.application.name=contract-story
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/contract_story_dev
spring.datasource.username=postgres
spring.datasource.password=root@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: Auto-generates tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Limits (allow up to 25MB contract PDFs / DOCX)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=./uploads

# JWT Configuration (256-bit Secret & 24h Expiry)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# AI / LLM Configuration (Universal OpenAI-Compatible Gateway)
# Works for Local Dev (FreeLLMAPI) AND Cloud Production (Google Gemini / NVIDIA NIM / Groq)
app.llm.enabled=${APP_LLM_ENABLED:true}
app.llm.base-url=${APP_LLM_BASE_URL:http://127.0.0.1:31415/v1}
app.llm.api-key=${APP_LLM_API_KEY:freellmapi-18d37e1c9c0b0bfa7b5f370e248f57ba60401e827cdbbc6e}
app.llm.model=${APP_LLM_MODEL:auto:fast}
app.llm.temperature=${APP_LLM_TEMPERATURE:0.2}